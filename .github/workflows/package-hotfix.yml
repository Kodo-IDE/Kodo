name: Package Hotfix

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: Parent release version (for example 2.1.0 or 2.1.0-BETA)
        required: true
        type: string
      hotfix:
        description: Positive hotfix level (for example 1)
        required: true
        type: number
      git_base_ref:
        description: Optional parent tag or Git ref; defaults to v<base_version> (v prefix is optional when entering the base tag)
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Windows hotfix package
    runs-on: windows-latest
    steps:
      - name: Checkout selected Kodo ref
        uses: actions/checkout@v5
        with:
          path: Kodo
          fetch-depth: 0

      - name: Checkout release tooling
        uses: actions/checkout@v5
        with:
          repository: Kodo-IDE/Kodo-Development
          path: dev
          token: ${{ secrets.KODO_DEVELOPMENT_READ_TOKEN }}

      - name: Inject private Aptabase keys
        shell: pwsh
        run: |
          $privateKeys = Join-Path $env:GITHUB_WORKSPACE 'dev/BuildSecrets/KEYS.cs'
          $targetKeys = Join-Path $env:GITHUB_WORKSPACE 'Kodo/Kodo/Source/KEYS.cs'
          if (-not (Test-Path -LiteralPath $privateKeys)) { throw 'Private Aptabase KEYS.cs was not checked out.' }
          Copy-Item -LiteralPath $privateKeys -Destination $targetKeys -Force

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Package Windows hotfix
        shell: pwsh
        env:
          BASE_VERSION: ${{ inputs.base_version }}
          HOTFIX: ${{ inputs.hotfix }}
          GIT_BASE_REF: ${{ inputs.git_base_ref }}
        run: |
          $gitBaseRef = $env:GIT_BASE_REF
          if ($gitBaseRef -eq $env:BASE_VERSION) { $gitBaseRef = "v$gitBaseRef" }
          $packageParameters = @{
            BaseVersion = $env:BASE_VERSION
            Hotfix = [int]$env:HOTFIX
            AutoDetectFiles = $true
            BuildWindowsInstaller = $true
            RuntimeIds = @('win-x64')
            KodoRoot = "$env:GITHUB_WORKSPACE/Kodo"
            OutputDirectory = "$env:RUNNER_TEMP/hotfix"
          }
          if (-not [string]::IsNullOrWhiteSpace($gitBaseRef)) {
            $packageParameters.GitBaseRef = $gitBaseRef
          }
          & ./dev/Release-Scripts/New-Hotfix.ps1 @packageParameters
          if ($LASTEXITCODE -ne 0) { throw "Hotfix packaging failed ($LASTEXITCODE)." }

      - name: Upload Windows hotfix patch and full installer
        uses: actions/upload-artifact@v7
        with:
          name: Kodo-Windows-hotfix
          path: ${{ runner.temp }}/hotfix/
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux hotfix packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout selected Kodo ref
        uses: actions/checkout@v5
        with:
          path: Kodo
          fetch-depth: 0

      - name: Checkout release tooling
        uses: actions/checkout@v5
        with:
          repository: Kodo-IDE/Kodo-Development
          path: dev
          token: ${{ secrets.KODO_DEVELOPMENT_READ_TOKEN }}

      - name: Inject private Aptabase keys
        run: |
          private_keys="$GITHUB_WORKSPACE/dev/BuildSecrets/KEYS.cs"
          target_keys="$GITHUB_WORKSPACE/Kodo/Kodo/Source/KEYS.cs"
          test -f "$private_keys"
          install -m 0644 "$private_keys" "$target_keys"

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Linux package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl libicu-dev libssl-dev fontconfig dpkg

      - name: Install appimagetool
        run: |
          curl -L --fail --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Package Linux hotfixes and full packages
        shell: pwsh
        env:
          BASE_VERSION: ${{ inputs.base_version }}
          HOTFIX: ${{ inputs.hotfix }}
          GIT_BASE_REF: ${{ inputs.git_base_ref }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          $gitBaseRef = $env:GIT_BASE_REF
          if ($gitBaseRef -eq $env:BASE_VERSION) { $gitBaseRef = "v$gitBaseRef" }
          $packageParameters = @{
            BaseVersion = $env:BASE_VERSION
            Hotfix = [int]$env:HOTFIX
            AutoDetectFiles = $true
            RuntimeIds = @('linux-x64', 'linux-arm64')
            KodoRoot = "$env:GITHUB_WORKSPACE/Kodo"
            OutputDirectory = "$env:RUNNER_TEMP/hotfix"
          }
          if (-not [string]::IsNullOrWhiteSpace($gitBaseRef)) {
            $packageParameters.GitBaseRef = $gitBaseRef
          }
          & ./dev/Release-Scripts/New-Hotfix.ps1 @packageParameters
          if ($LASTEXITCODE -ne 0) { throw "Hotfix packaging failed ($LASTEXITCODE)." }

      - name: Upload Linux hotfix packages
        uses: actions/upload-artifact@v7
        with:
          name: Kodo-Linux-hotfix
          path: ${{ runner.temp }}/hotfix/
          if-no-files-found: error
          retention-days: 30
