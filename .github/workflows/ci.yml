name: Builds

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Kodo
        run: dotnet publish Kodo/Source/Kodo.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/Kodo-windows-x64

      - name: Publish KodoUpdater
        run: dotnet publish Kodo/Source/KodoUpdater/KodoUpdater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/KodoUpdater-windows-x64

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Kodo-windows-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Build on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu 24.04 LTS
            id: ubuntu-24.04
            image: ubuntu:24.04
          - distro: Linux Mint 22
            id: linux-mint-22
            image: linuxmintd/mint22-amd64:latest
          - distro: Fedora 44
            id: fedora-44
            image: fedora:44
    steps:
      - name: Install native build dependencies
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl libicu-dev libssl-dev fontconfig
          else
            dnf install -y ca-certificates curl libicu openssl-libs fontconfig
          fi

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Kodo
        shell: bash
        run: dotnet publish Kodo/Source/Kodo.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "artifacts/Kodo-${{ matrix.id }}"

      - name: Publish KodoUpdater
        shell: bash
        run: dotnet publish Kodo/Source/KodoUpdater/KodoUpdater.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "artifacts/KodoUpdater-${{ matrix.id }}"

      - name: Archive Linux build preserving executable permissions
        shell: bash
        run: tar -czf "Kodo-${{ matrix.id }}.tar.gz" -C artifacts .

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: Kodo-${{ matrix.id }}
          path: Kodo-${{ matrix.id }}.tar.gz
          if-no-files-found: error
          retention-days: 30
