name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Linux native deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev libssl-dev fontconfig

      - name: Build Kodo
        run: dotnet build Kodo/Source/Kodo.csproj -c Release --nologo

      - name: Build KodoUpdater
        run: dotnet build Kodo/Source/KodoUpdater/KodoUpdater.csproj -c Release --nologo

      # NOTE: the hotfix test suite lives outside this repo (Kodo-Tests, never
      # committed by policy), so CI does not run it. Run it locally by
      # temporarily restoring Kodo-Tests/KodoRepoTests to Kodo/Tests
      # (git-ignored) and running:
      #   dotnet test Kodo/Tests/Kodo.Hotfix.Tests/Kodo.Hotfix.Tests.csproj -c Release

  linux-packages:
    name: Linux release packages
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          repository: Kodo-IDE/Kodo-Development
          path: dev

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev libssl-dev fontconfig dpkg

      - name: Install appimagetool
        if: runner.os == 'Linux'
        run: |
          curl -L --fail --retry 3 \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build Linux archives for x64 and ARM64
        env:
          KODO_ROOT: ${{ github.workspace }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: bash dev/scripts/build-linux-release.sh "${RUNNER_TEMP}/kodo-linux-dist" "2.1.0-BETA"

      - name: Verify archive contents and executable bits
        run: |
          for rid in linux-x64 linux-arm64; do
            archive="${RUNNER_TEMP}/kodo-linux-dist/Kodo-2.1.0-BETA-${rid}.tar.gz"
            tar -tzf "$archive" | grep -Fxq 'kodo/Kodo'
            tar -tzf "$archive" | grep -Fxq 'kodo/KodoUpdater'
            tar -tzf "$archive" | grep -Fxq 'kodo/kodo.desktop'
            tar -tzf "$archive" | grep -Fxq 'kodo/kodo-logo.png'
            tar -tzf "$archive" | grep -Fxq 'kodo/hotfix-build.json'
            tar -tzf "$archive" | grep -Fxq 'kodo/.kodo-managed-install'
            tar -tvzf "$archive" | awk '$1 ~ /x/ && $NF == "kodo/Kodo" { app=1 } $1 ~ /x/ && $NF == "kodo/KodoUpdater" { updater=1 } END { exit !(app && updater) }'
          done
